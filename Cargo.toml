[package]
name = "yaac"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Terminal Anki client built on Anki's own Rust backend"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
anki = { git = "https://github.com/ankitects/anki", tag = "26.08.1", features = ["rustls"] }
anki_proto = { git = "https://github.com/ankitects/anki", tag = "26.08.1" }
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
# Terminal graphics (Kitty, Sixel, iTerm2, half-blocks); default features would link libchafa.
ratatui-image = { version = "11", default-features = false, features = ["image-defaults", "crossterm"] }
image = "0.25"
resvg = "0.48"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# CSS 2.1 parsing and selector matching for card stylesheets; usvg brings it in anyway.
simplecss = "0.2"
# Same major as rslib's, so the `Client` type lines up; TLS comes from rslib's features.
reqwest = { version = "0.12", default-features = false }
rpassword = "7.5"
toml = "1.1"
# io-util is what rslib needs but does not request itself; rt-multi-thread runs sync.
tokio = { version = "1.53", features = ["io-util", "rt-multi-thread"] }
# LaTeX math typeset in-process, a KaTeX port with its fonts embedded; pinned exactly
# because the crate is young and its 0.1.x releases change the API.
ratex-render = { version = "=0.1.14", features = ["embed-fonts"] }
ratex-layout = "=0.1.14"
ratex-parser = "=0.1.14"
ratex-types = "=0.1.14"
# LaTeX to Unicode text, for formulas simple enough to stay in the text.
unicodeit = "0.2.1"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
